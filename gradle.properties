# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# 4 GB heap + 1 GB metaspace: AGP 9.1 + Kotlin 2.4 + R8 full-mode comfortably exceed the old
# 2 GB ceiling on this project; GitHub's standard public-repo runners have 16 GB, so this is safe.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Build :app and :color in parallel (they are decoupled).
org.gradle.parallel=true
# Reuse task outputs across builds (and across CI runs via the setup-gradle action's cache).
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
ABI_FILTERS=arm64-v8a
#
# Deliberately ABSENT (AGP 9 made them defaults — keeping them would be noise):
#   android.useAndroidX=true      → default true since AGP 9.0
#   android.nonFinalResIds=true   → non-final R-class behavior is the AGP 9 default
# Also deliberately absent: every AGP 9 opt-out escape hatch (android.newDsl,
# android.builtInKotlin, android.enableLegacyVariantApi, ...). This project runs
# on the new DSL + built-in Kotlin natively, which is mandatory in AGP 10 anyway.
