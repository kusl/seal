[versions]
# ── Build toolchain ───────────────────────────────────────────────────────────
# AGP 9.1.1 is the latest stable release that supports compileSdk 37 ("Android
# Gradle plugin 9.1.1 supports Android API level 37.0 and below" — official
# release notes, April 2026). compileSdk 37 is now mandatory: androidx.core
# 1.19.0 declares minCompileSdk=37 / minAgp=9.1.0 in its AAR metadata, which is
# exactly what broke the previous AGP-8.13.2 build.
#
# AGP 9 consequences absorbed by this catalog:
#   • Built-in Kotlin: the org.jetbrains.kotlin.android plugin is INCOMPATIBLE
#     with AGP 9's new DSL and must not be applied — its [plugins] entry is gone.
#     AGP itself now drives the Kotlin compilation. The Kotlin *version* is
#     raised above AGP's bundled 2.2.10 via an explicit kotlin-gradle-plugin
#     classpath dependency in the root build.gradle.kts (Google's documented
#     mechanism) — keep that literal in lockstep with `kotlin` below.
#   • The legacy variant API (android.applicationVariants) is removed; the APK
#     rename that used it now lives in .github/workflows/release.yml.
#   • AGP 9.1.x requires Gradle ≥ 9.1.0 and JDK ≥ 17 (we build on 21).
androidGradlePlugin = "9.2.1"

# Kotlin 2.4.0 (June 2026) is the latest stable language release; JetBrains
# documents explicit compatibility with Gradle 9.5. The serialization and
# compose-compiler subplugins below ride this same version, and the root
# build.gradle.kts pins kotlin-gradle-plugin:2.4.0 on the build classpath so
# AGP 9's built-in Kotlin compiles with 2.4.0 instead of its bundled 2.2.10.
kotlin = "2.4.0"

# KSP versions are standalone (decoupled from the Kotlin compiler) since 2.3.0.
# AGP 9 / built-in-Kotlin support landed in 2.3.1, and Google's own AGP-9
# upgrade guidance (last updated 2026-06-03) requires ≥ 2.3.6. 2.3.9 is the
# latest release. Mirrored on the root build classpath next to KGP — keep the
# two literals in lockstep with this entry.
ksp = "2.3.9"

# ── AndroidX / Compose ────────────────────────────────────────────────────────
# Latest stable Compose BOM. 2026.05.01 is a patch release above the 2026.05.00
# previously pinned here; it maps to Compose 1.11.x / Material 3 1.4.x stable.
androidxComposeBom = "2026.05.01"

# The androidx.compose.material:material-icons-* artifacts stopped being
# published after 1.7.x and were REMOVED from the Compose BOM. 1.7.8 is the
# final version and is forward-compatible with Compose 1.11 (it only depends on
# stable ui/runtime APIs). It must carry an explicit version.
composeMaterialIcons = "1.7.8"

# core 1.19.0 is the artifact that forces the compileSdk-37 / AGP-9.1 floor.
androidxCore = "1.19.0"
androidMaterial = "1.14.0"
androidxAppCompat = "1.7.1"
androidxActivity = "1.13.0"
graphics = "1.0.1"
constraintLayout = "1.1.1"

androidxLifecycle = "2.10.0"
androidxNavigation = "2.9.8"

# androidx.test unified release train; androidTest-only — not in release builds.
androidxEspresso = "3.7.0"
androidxTestExt = "1.3.0"

# ── App libraries ─────────────────────────────────────────────────────────────
# Coil 3 (package `coil3`). Networking is not bundled in coil-core — the
# coil-network-okhttp artifact below restores http(s) image loading via the
# OkHttp we already ship. See AsyncImageImpl.kt for the (single-file) migration.
coil = "3.4.0"

junit4 = "4.13.2"

serialization = "1.11.0"

# OkHttp 5.x stable line; also backs Sentry's OkHttp auto-instrumentation.
okhttp = "5.4.0"

room = "2.8.4"

youtubedlAndroid = "0.17.3"

# MMKV 2.x is 64-bit only. The build ships only arm64-v8a / x86_64 APKs, so on
# the rare 32-bit-only Android 14 device the installer simply reports "no
# matching ABI" instead of the app crashing — acceptable for a minSdk-34 fork.
mmkv = "2.4.0"

koin = "4.2.1"

# accompanist-permissions is alive and current at 0.37.x. accompanist-webview
# and accompanist-pager-indicators were REMOVED upstream after 0.34/0.35, so the
# two artifacts that still use them stay pinned to the last version that ships
# them. They only use stable Compose/AndroidView APIs, so they remain
# binary-compatible with Compose 1.11. (Long-term: migrate WebViewPage to a raw
# AndroidView and the one HorizontalPagerIndicator usage to a custom composable.)
accompanist = "0.37.3"
accompanistLegacy = "0.34.0"

# Sentry SDK (io.sentry:sentry-android + sentry-okhttp) and the Sentry Android
# Gradle plugin. AGP 9 support shipped in plugin 5.12.2 (getsentry/
# sentry-android-gradle-plugin#1004); 6.10.0 (June 3, 2026) is the latest
# release and is verified compatible — the previous build configured cleanly
# with it and only failed later at the AAR-metadata check. Keep all io.sentry:*
# artifacts on the same `sentry` version to avoid the SDK's deliberate
# "mixed versions" init crash.
sentry = "8.43.1"
sentryGradlePlugin = "6.10.0"

[libraries]

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "androidMaterial" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

androidx-lifecycle-runtimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
# Removed upstream after 0.34/0.35 — pinned to the last published version (see note above).
accompanist-webview = { group = "com.google.accompanist", name = "accompanist-webview", version.ref = "accompanistLegacy" }
accompanist-pager-indicators = { group = "com.google.accompanist", name = "accompanist-pager-indicators", version.ref = "accompanistLegacy" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }

androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# No longer in the BOM — explicit (final) version required, see [versions].
androidx-compose-material-iconsExtended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }

androidx-compose-material = { group = "androidx.compose.material", name = "material" }

androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-windowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class" }

androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintLayout" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

androidx-test-ext = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExt" }

androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }

# Coil 3: compose bindings + the OkHttp network fetcher (auto-registered via
# service loader — no code needed beyond having it on the classpath).
coil-kt-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

youtubedl-android-library = { group = "io.github.junkfood02.youtubedl-android", name = "library", version.ref = "youtubedlAndroid" }
youtubedl-android-ffmpeg = { group = "io.github.junkfood02.youtubedl-android", name = "ffmpeg", version.ref = "youtubedlAndroid" }
youtubedl-android-aria2c = { group = "io.github.junkfood02.youtubedl-android", name = "aria2c", version.ref = "youtubedlAndroid" }

mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }

sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
# Required by the Sentry Gradle plugin's OKHTTP instrumentation feature. Same
# version as sentry-android — mandatory.
sentry-okhttp = { group = "io.sentry", name = "sentry-okhttp", version.ref = "sentry" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
# NOTE: there is deliberately no `kotlin-android` plugin entry anymore. AGP 9's
# built-in Kotlin replaces org.jetbrains.kotlin.android, and applying that
# plugin under the new DSL is a hard configuration error ("Cannot add extension
# with name 'kotlin'..."). The serialization and Compose compiler subplugins
# below remain — they attach to the Kotlin compilation that built-in Kotlin
# runs, and are the supported way to enable those compiler plugins on AGP 9.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentryGradlePlugin" }


[bundles]
accompanist = [
    "accompanist-permissions",
    "accompanist-webview",
    "accompanist-pager-indicators",
]

androidxCompose = ["androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material-iconsExtended",
    "androidx-compose-material3",
    "androidx-compose-material3-windowSizeClass",
    "androidx-compose-foundation",
    "androidx-navigation-compose",
    "androidx-compose-animation",
    "androidx-constraintlayout-compose"
]

youtubedlAndroid = ["youtubedl-android-library",
    "youtubedl-android-ffmpeg",
    "youtubedl-android-aria2c"]

core = ["androidx-activity-compose",
    "android-material",
    "androidx-appcompat",
    "androidx-core-ktx"]
